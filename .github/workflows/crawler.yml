name: Crawler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "from crawler import run_crawler; run_crawler()"
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
