<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da vaga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>
  <header class="topbar">
    <a class="topbar__brand" href="/">vagas remotas</a>
  </header>

  <main class="page">
    <a class="detail__back" href="/">Voltar ao painel</a>

    <p class="state" id="state">Carregando a vaga</p>

    <article class="detail" id="detail" hidden>
      <div class="detail__company">
        <img class="detail__logo" id="logo" alt="" hidden>
        <span class="detail__company-name" id="company"></span>
      </div>

      <h1 class="detail__title" id="title"></h1>

      <ul class="chips" id="chips"></ul>

      <a class="detail__action" id="original" target="_blank" rel="noopener noreferrer">
        Ver a vaga no site original
      </a>

      <section class="record">
        <p class="record__caption">Procedência do registro</p>
        <dl class="record__grid">
          <div>
            <dt class="record__term">Site de origem</dt>
            <dd class="record__value" id="source"></dd>
          </div>
          <div>
            <dt class="record__term">Página coletada</dt>
            <dd class="record__value" id="source-url"></dd>
          </div>
          <div>
            <dt class="record__term">Última coleta</dt>
            <dd class="record__value" id="collected-at"></dd>
          </div>
          <div>
            <dt class="record__term">Sede da empresa</dt>
            <dd class="record__value" id="location"></dd>
          </div>
        </dl>
      </section>
    </article>
  </main>

  <script type="module" src="assets/js/detalhe.js"></script>
</body>

</html>
